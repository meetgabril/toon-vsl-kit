<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:"Bungee";src:url(fonts/bungee-latin-400-normal.woff2)}@font-face{font-family:"VT323";src:url(fonts/vt323-latin-400-normal.woff2)}@font-face{font-family:"Baloo 2";font-weight:800;src:url(fonts/baloo-2-latin-800-normal.woff2)} html,body{margin:0}</style></head><body><canvas id="c" width="2160" height="1920"></canvas>
<script type="module">
import { init, frame, push, pop, translate, scale, g } from './toon.js';
import { loadPeeps, takePending } from './peeps.js'; import { peep, folk2, transformFig } from './chars2.js';
init(document.getElementById('c')); await loadPeeps(); for (const f of ['400 40px Bungee']) await document.fonts.load(f);
async function draw() {
  frame(0.2); g.setTransform(1,0,0,1,0,0); g.fillStyle = '#efe6d6'; g.fillRect(0,0,2160,1920);
  ['down', 'hips', 'flex', 'point'].forEach((a, i) => peep('T', { x: 270 + i * 540, y: 930, s: 1.15, arms: a, mood: 'smile', t: 1, blinkOff: true }));
  ['phone', 'runB', 'runA'].forEach((a, i) => peep('T', { x: 270 + i * 540, y: 1880, s: 1.15, arms: a, legs: a.startsWith('run') ? 'run' : 'stand', walkPh: 1.4, mood: 'smile', t: 1, blinkOff: true }));
  peep('T', { x: 1890, y: 1880, s: 1.15, arms: 'hips', bare: true, mood: 'smile', t: 1, blinkOff: true });
}
for (let i = 0; i < 6; i++) { await draw(); const p = takePending(); if (!p.length) break; await Promise.all(p); }
window.ready = true;
</script></body></html>
